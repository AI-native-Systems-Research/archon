name: CI

# Separate from archon.yml on purpose. That workflow is issue_comment-triggered
# and needs pull-requests: write to post a review; this one only reads code.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # No fetch-depth: nothing here needs history. Flow 2 of the demo suite
      # operates on committed JSON fixtures, not git refs.
      - uses: actions/checkout@v5

      # go.mod is the single source of truth for the toolchain, so the workflow
      # cannot drift from it.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # gofmt -l exits 0 whether or not it finds anything, so this has to assert
      # on the output. Checking the exit code would silently never fire.
      - name: Gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            echo "::error::gofmt needs to run on these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./...

      # BLIS_REPO is deliberately left unset: the checks needing a BLIS checkout
      # skip cleanly without it, and 11 golden checks still run — flow 2, two
      # file-only flow 3 checks, and flow 4's fixture table and --json.
      # run-all.sh exits 1 on any golden mismatch and names what it skipped, so an
      # unverified golden is visible rather than folded into a pass. What it cannot
      # verify here is flow 1 and flow 4's BLIS goldens, which need the checkout.
      #
      # This job must never regenerate a golden file. Per docs/CONTRIBUTING.md a
      # golden change is a human decision — CI reports the diff and fails.
      - name: Golden demos
        run: |
          go build -o archon-go .
          ARCHON=./archon-go ./demo/run-all.sh
