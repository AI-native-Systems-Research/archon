name: CI

# Separate from archon.yml on purpose. That workflow is issue_comment-triggered
# and needs pull-requests: write to post a review; this one only reads code.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # No fetch-depth: nothing here needs history. Flow 2 of the demo suite
      # operates on committed JSON fixtures, not git refs.
      - uses: actions/checkout@v5

      # go.mod is the single source of truth for the toolchain, so the workflow
      # cannot drift from it.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # BLIS_REPO is deliberately left unset: flows 1 and 3 need a BLIS checkout
      # and skip cleanly without it, while flow 2 still runs 7 real golden checks.
      # run-all.sh exits 1 on any golden mismatch.
      #
      # This job must never regenerate a golden file. Per docs/CONTRIBUTING.md a
      # golden change is a human decision — CI reports the diff and fails.
      - name: Golden demos
        run: |
          go build -o archon-go .
          ARCHON=./archon-go ./demo/run-all.sh
